name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -m "not smoke" tests/ -q

  package-sanity:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install "build>=1,<2"
      - name: Build distributions
        run: python -m build
      - name: Install wheel and verify package metadata
        run: |
          python -m venv .package-check
          .package-check/bin/python -m pip install --no-deps dist/*.whl
          .package-check/bin/python -c "from importlib.metadata import version; assert version('biyoves') == '2.3.0'"
          test -f app.py
