[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biyoves"
version = "3.0.0"
description = "Local app for preparing biometric and ID photos."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask>=3.1,<4",
    "numpy>=1.19.0",
    "Pillow>=10,<13",
    "mediapipe==0.10.35",
    "opencv-contrib-python>=4.5.0",
    "transformers>=5.14,<5.18",
    "huggingface-hub>=1.24,<2",
    "safetensors>=0.4,<1",
    "timm>=1.0,<2",
    "kornia>=0.8,<1",
    "einops>=0.8,<1",
    "platformdirs>=4,<5",
    "torch>=2.13,<2.15",
    "torchvision>=0.28,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1,<2",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
biyoves = "biyoves.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["biyoves", "biyoves.web"]
include-package-data = true

[tool.setuptools.package-data]
biyoves = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
